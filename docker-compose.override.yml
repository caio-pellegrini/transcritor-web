services:
  app:
    build:
      target: dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - ./public:/var/www/html/public
      - dev_node_modules:/var/www/html/node_modules
      - dev_vendor:/var/www/html/vendor

  nginx:
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - .:/var/www/html
      - dev_vendor:/var/www/html/vendor

volumes:
  dev_node_modules:
  dev_vendor:

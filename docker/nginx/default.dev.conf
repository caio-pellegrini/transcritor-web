server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # 500 MiB de arquivo + margem para o envelope multipart.
    client_max_body_size 510M;
    client_body_timeout 7200s;
    send_timeout 7200s;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' http://localhost:5173 https://accounts.google.com https://apis.google.com https://www.googleapis.com; style-src 'self' https://accounts.google.com; img-src 'self' data: https://accounts.google.com https://*.googleusercontent.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' http://localhost:5173 ws://localhost:5173 https://accounts.google.com https://apis.google.com https://www.googleapis.com https://oauth2.googleapis.com; frame-src https://accounts.google.com;" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param CSP_NONCE $request_id;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 7200s;
        fastcgi_read_timeout 7200s;
        fastcgi_request_buffering off;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
